name: Bangun APK Android

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Terima lisensi SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Bangun APK debug
        run: gradle assembleDebug --no-daemon

      - name: Kumpulkan hasil
        run: |
          mkdir -p hasil
          cp app/build/outputs/apk/debug/*.apk hasil/StudioKartun-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StudioKartun-APK
          path: hasil/*.apk
